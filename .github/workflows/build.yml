name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  x64:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Build x64 release
        shell: pwsh
        run: .\build.ps1 -Configuration Release
      - uses: actions/upload-artifact@v4
        with:
          name: fuck-helium-x64
          path: out/x64/release/*

